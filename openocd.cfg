# OpenOCD 配置：STM32F407 + 板载 CMSIS-DAP

# 接口
source [find interface/cmsis-dap.cfg]
transport select swd

# 适配器速度
adapter speed 400

# 目标芯片
source [find target/stm32f4x.cfg]

# ---------------------------------------------------------------- 复位配置 ---
# ★ 这一行和 CEMPES 原来的 "reset_config none separate" 不一样，不能改回去。
#
# 本工程把 PA14 用作 Y 轴电机的 DIR。PA14 同时是 SWCLK：固件一运行，
# PA14 就被重新配置成普通推挽输出，SWD 立刻失联 —— 这不是偶发故障，
# 是必然现象（ZHSX 第一版实测过）。
#
# connect_assert_srst = 连接期间一直按住复位，让内核停在复位状态再握手，
# 这样调试器才能在固件接管 PA14 之前连上芯片。
reset_config srst_only srst_nogate connect_assert_srst
